                <div id="code-wrapper" class="code-wrapper open">
                    <div class="panel">
                        <div class="panel-heading">
                            <strong>Modelo</strong>
                        </div>
                        <div class="panel-body no-padding">
                            <textarea class="code-editor" id="code" name="code"></textarea>
                        </div>
                        <div class="panel-footer">
                            <button id="autoformat-btn" type="button">
                                Formatar
                            </button>
                            <button id="create-btn" type="button">
                                Gerar etiqueta
                            </button>
                            <button id="export-btn" type="button">
                                Exibir formato de impressão
                            </button>

                                Imprimir
                            </button>

                                Exibir template
                            </button>

                            </button>

                                ?
                            </button>
                        </div>
                    </div>

                </div>

                        <div class="panel-heading">

                        <textarea class="value-editor" id="values" name="values">
                    </textarea>
                        </div>
                    </div>
                </div>
            </div>
